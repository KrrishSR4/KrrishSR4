name: Open Source Galaxy

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build-galaxy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Galaxy SVG
        run: node .github/scripts/constellation.js

      - name: Commit Galaxy SVG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add assets/galaxy.svg

          git diff --staged --quiet || git commit -m "chore: update galaxy"

          git push
