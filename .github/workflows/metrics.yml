name: 🧮 Profile Metrics

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # REQUIRED: create a classic PAT with 'repo' scope if you want private stats
          # Then add it in repo settings → Secrets and variables → Actions → New repository secret
          # Name it METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}

          user: KrrishMishra
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large

          # Plugins to highlight PRs/Issues/Commits & patterns
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_followup: yes
          plugin_followup_sections: user

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_lines: yes

          # Output file path
          filename: metrics.svg

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(metrics): update profile metrics"
          file_pattern: metrics.svg
